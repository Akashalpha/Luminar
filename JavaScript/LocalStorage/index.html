<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-blue-200">
    <div class="flex justify-center items-center p-5 flex-col">
      <h1 class="text-center text-3xl">Local Storage</h1>
      <div class="border mt-8  p-5 flex justify-around">
        <label
          for="message"
          class="block mb-2.5 p-5 border-white text-sm font-medium text-heading"
          >Your message</label
        >
        <textarea
          id="message"
          rows="4"
          class="bg-neutral-secondary-medium border border-default-medium border text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full p-3 shadow-xs placeholder:text-body"
          placeholder="Write your thoughts here..."
        ></textarea>

        <button
          onclick="inputData()"
          type="button"
          class="text-white mx-2 rounded bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-1 focus:outline-none focus:ring-teal-100 dark:focus:text-black     font-medium rounded-sm-4px text-sm px-4 focus:ring-teal-300text-center  "
        >
          Store
        </button>
      </div>
    </div>

    <h1 id="result" class="text-center p-5 text-3xl"></h1>
  </body>
  <script src="./script.js"></script>
</html>
