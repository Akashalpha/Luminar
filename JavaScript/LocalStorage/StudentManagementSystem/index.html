<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1d2b36;
        --ink-2: #33495b;
        --paper: #f1ece0;
        --paper-2: #e8e1d1;
        --card: #fffdf8;
        --gold: #b9862f;
        --gold-2: #8c6423;
        --clay: #a6472c;
        --hairline: #d9d0bc;
      }
      body {
        font-family: "IBM Plex Sans", sans-serif;
        background-color: var(--paper);
      }
      .font-serif {
        font-family: "Source Serif 4", serif;
      }
      .font-mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .paper-texture {
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(29, 43, 54, 0.05) 1px,
          transparent 0
        );
        background-size: 22px 22px;
      }

      .field-input {
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--hairline);
        padding: 0.55rem 0.1rem;
        font-size: 0.95rem;
        color: var(--ink);
        width: 100%;
        transition: border-color 0.15s ease;
      }
      .field-input:focus {
        outline: none;
        border-bottom-color: var(--gold);
      }
      .field-label {
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        color: var(--ink-2);
        opacity: 0.75;
      }

      .stamp-btn {
        background: var(--ink);
        color: var(--paper);
        border: 1px solid var(--ink);
        transition:
          transform 0.12s ease,
          background 0.15s ease;
      }
      .stamp-btn:hover {
        background: var(--ink-2);
      }
      .stamp-btn:active {
        transform: scale(0.98);
      }

      .ledger-card {
        background: var(--card);
        border: 1px solid var(--hairline);
      }

      /* #result's injected markup isn't wrapped in one container per student,
     so style it as a stacked ledger list using the heading as a divider. */
      #result {
        background: var(--card);
        border: 1px solid var(--hairline);
        padding: 0.5rem 1.75rem;
      }
      #result h2 {
        padding-top: 1.5rem;
        margin-top: 1.5rem;
        border-top: 1px solid var(--hairline);
      }
      #result h2:first-of-type {
        margin-top: 0;
        border-top: none;
      }
      #result > div.space-y-2 {
        margin-top: 0.5rem;
      }
      #result > div.flex {
        margin: 1rem 0 1.75rem;
      }
      #result p {
        color: var(--ink-2);
        font-size: 0.95rem;
      }
      #result p .font-semibold {
        color: var(--ink);
        font-weight: 500;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <!-- Letterhead -->
    <header
      class="paper-texture border-b"
      style="border-color: var(--hairline); background-color: var(--paper-2)"
    >
      <div class="max-w-6xl mx-auto px-6 md:px-10 py-8">
        <h1
          class="font-serif text-3xl md:text-4xl font-semibold"
          style="color: var(--ink)"
        >
          Student Management System
        </h1>
        <p class="text-sm mt-1" style="color: var(--ink-2)">
          Enrollment register &amp; contact roster
        </p>
      </div>
    </header>

    <main
      class="max-w-6xl mx-auto px-6 md:px-10 py-10 grid grid-cols-1 lg:grid-cols-[340px_1fr] gap-8 items-start"
    >
      <!-- New entry form -->
      <section
        class="ledger-card p-6 lg:sticky lg:top-10"
        style="box-shadow: 0 1px 0 var(--hairline)"
      >
        <p class="font-serif text-lg mb-5" style="color: var(--ink)">
          New entry
        </p>

        <div class="mb-5">
          <label for="nameInp" class="field-label block mb-1">Full name</label>
          <input
            id="nameInp"
            type="text"
            class="field-input"
            placeholder="e.g. Priya Menon"
            autocomplete="off"
          />
        </div>

        <div class="mb-5">
          <label for="phoneInp" class="field-label block mb-1"
            >Phone number</label
          >
          <input
            id="phoneInp"
            type="tel"
            class="field-input"
            placeholder="e.g. 9847012345"
            autocomplete="off"
          />
        </div>

        <div class="mb-6">
          <label for="courseInp" class="field-label block mb-1">Course</label>
          <input
            id="courseInp"
            type="text"
            class="field-input"
            placeholder="e.g. MEARN"
            autocomplete="off"
          />
        </div>

        <button
          id="addBtn"
          onclick="onAddClick()"
          class="stamp-btn w-full py-2.5 text-sm font-medium tracking-wide"
        >
          Add student
        </button>
        <button
          style="display: none"
          id="editBtn"
          onclick="onAddClick()"
          class="stamp-btn w-full py-2.5 text-sm font-medium tracking-wide"
        >
          Edit student
        </button>
      </section>

      <!-- Data display box -->
      <section>
        <p class="font-serif text-lg mb-4" style="color: var(--ink)">Roster</p>
        <div id="result"></div>
      </section>
    </main>

    <footer class="max-w-6xl mx-auto px-6 md:px-10 pb-10">
      <p class="text-xs" style="color: var(--ink-2)">
        Entries are saved to this browser and persist between visits.
      </p>
    </footer>
  </body>
  <script src="script.js"></script>
</html>
