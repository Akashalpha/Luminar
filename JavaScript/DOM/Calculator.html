<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            background-color: rgb(58, 70, 85);
            
        }
        #head{
            color: white;
            text-align: center;
            margin-top: 100px;
            font-family: "Roboto", sans-serif;
        }
         .btn{
            
            
            border: 1px solid #3d4958;
            width: 48px;
            height: 50px;
            color: white;
            
         }
         .btn:hover {
            background-color:#536174;
         }
    </style>
</head>
<body>
    <h1 id="head">Calculator</h1>
     
    <div style="display: flex;justify-content: center;">
        <div style="box-shadow: 0px 10px 40px black;" class="Calculator">
            <div style="padding: 10px;">
                <input id="result" style="background-color: white;padding: 7px;border-radius: 5px;" type="text" placeholder="0"><br>
            </div>
            <button onclick="displayData('7')"class="btn">7</button>
            <button onclick="displayData('8')" class="btn">8</button>
            <button onclick="displayData('9')" class="btn">9</button>
            <button onclick="displayData('*')" class="btn">x</button><br>
            <button onclick="displayData('4')" class="btn">4</button>
            <button onclick="displayData('5')" class="btn">5</button>
            <button onclick="displayData('6')" class="btn">6</button>
            <button onclick="displayData('-')" class="btn">-</button><br>
            <button onclick="displayData('1')" class="btn">1</button>
            <button onclick="displayData('2')" class="btn">2</button>
            <button onclick="displayData('3')" class="btn">3</button>
            <button onclick="displayData('+')" class="btn">+</button><br>
            <button onclick="clearData()" class="btn">AC</button>
            <button onclick="displayData('0')" class="btn">0</button>
            <button onclick="displayData('/')" class="btn">÷</button>
            <button onclick=" calculateVal()" class="btn">=</button><br>
            <button onclick="deleteLast()" class="btn">⌫</button>
        </div>
    </div>
</body>
<script src="./Calculator.js"></script>
</html>
