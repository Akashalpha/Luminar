<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>
  <body>
    <h1>HTML Forms</h1>
    <form>
      <label for="name">Name</label>
      <input id="name" placeholder="Enter your name" type="text" />
      <br /><br />
      <label for="age">Age</label>
      <input
        type="number"
        placeholder="Enter your age"
        name=""
        id="age
      "
      />
      <br /><br />
      <label for="email">E-mail</label>
      <input type="email" name="" placeholder="Enter your email" id="email" />
      <br /><br />
      <label for="phno">Phone No</label>
      <input type="number" name="" placeholder="Enter your number" id="phno" />
      <br /><br />
      <label for="date">DOB</label>
      <input type="date" name="" id="date" />
      <br /><br />
      <label for="datetime-local">Date and Time</label>
      <input type="datetime-local" name="" id="datetime-local" />
      <br /><br />
      <label for="color">Color</label>
      <input type="color" name="" placeholder="Enter color" id="color" />
      <br /><br />
      <label for="password">Password</label>
      <input
        type="password"
        name=""
        placeholder="Enter password"
        id="password"
      />
      <br /><br />
      <label for="">Gender</label><br />
      <input type="radio" name="Gender" id="male" />
      <label for="male">Male</label>

      <input type="radio" name="Gender" id="female" />
      <label for="female">Female</label>

      <input type="radio" name="Gender" id="others" />
      <label for="others">Others</label>
      <br /><br />
      <label for="">Hobbies</label><br />
      <input type="checkbox" name="" id="dancing" />
      <label for="dancing">Dancing</label>
      <input type="checkbox" name="" id="reading" />
      <label for="reading">Reading</label>

      <input type="checkbox" name="" id="socaialmedia" />
      <label for="socialmedia">Social Media</label>

      <input type="checkbox" name="" id="gaming" />
      <label for="gaming">Gaming</label>
      <br /><br />
      <label for="address">Address</label><br />
      <textarea rows="5" cols="40" id="address"></textarea>
      <br /><br />
      <label for="resume">Resume</label>
      <input type="file" name="" id="resume" />
      <!-- file submittion -->
      <br /><br />
      <button>RESET</button>
      <input type="button" value="SUBMIT" />
      <!-- input:button -->
      <input type="submit" value="SAVE AND SUBMIT" />
      <!-- input:submit -->
    </form>
  </body>
</html>
