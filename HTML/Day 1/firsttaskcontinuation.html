    <!-- Mern Stack Workig  -->
    <h2>How MERN Stack Works</h2>
    <ol type="1">
      <li>User interacts with the React frontend.</li>
      <li>React sends requests to the Express/Node.js server.</li>
      <li>Express processes the requests.</li>
      <li>Node.js communicates with MongoDB.</li>
      <li>MongoDB stores or retrieves data.</li>
      <li>Data is sent back to React and displayed to the user.</li>
    </ol>
